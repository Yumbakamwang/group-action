<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action de groupe</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      text-align: center;
    }
    header {
      background: #1565c0;
      color: white;
      padding: 70px 20px;
    }
    h1 { font-size: 42px; margin: 0 0 12px; }
    p { font-size: 18px; }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0002;
    }
    button {
      background: #1565c0;
      color: white;
      border: 0;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Action de groupe</h1>
    <p>Ensemble, nous pouvons faire la différence.</p>
  </header>

  <main>
    <div class="card">
      <h2>Bienvenue</h2>
      <p>Rejoignez notre action de groupe et participez à nos activités.</p>
      <button onclick="alert('Merci pour votre intérêt !')">
        Nous rejoindre
      </button>
    </div>
  </main>
</body>
</html>
